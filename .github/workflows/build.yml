name: Build & Release Standalone Executables (PyApp)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: TorrentCreator-windows-x64.exe
            binary_src: target/release/pyapp.exe
            is_gui: "1"
          - os: ubuntu-latest
            artifact_name: TorrentCreator-linux-x64
            binary_src: target/release/pyapp
            is_gui: "0"
          - os: macos-latest
            artifact_name: TorrentCreator-macos-arm64
            binary_src: target/release/pyapp
            is_gui: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Wheel Package
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Setup PyApp Source
        shell: bash
        run: |
          mkdir -p build/pyapp
          curl -sSL https://github.com/ofek/pyapp/releases/download/v0.29.0/source.tar.gz | tar -xz -C build/pyapp
          # Source is unpacked into build/pyapp/pyapp-v0.29.0

      - name: Compile PyApp Standalone Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem -Path dist -Filter "*.whl" | Select-Object -First 1).FullName
          $env:PYAPP_PROJECT_PATH = $wheel
          $env:PYAPP_PYTHON_VERSION = "3.12"
          $env:PYAPP_EXEC_MODULE = "main"
          $env:PYAPP_UV_ENABLED = "1"
          $env:PYAPP_IS_GUI = "${{ matrix.is_gui }}"
          $env:PYAPP_DISTRIBUTION_EMBED = "1"
          
          cd build/pyapp/pyapp-v0.29.0
          cargo build --release
          cd ../../..
          
          New-Item -ItemType Directory -Force -Path release
          Copy-Item build/pyapp/pyapp-v0.29.0/${{ matrix.binary_src }} -Destination release/${{ matrix.artifact_name }}

      - name: Compile PyApp Standalone Executable (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl | head -n 1)
          export PYAPP_PROJECT_PATH="$(pwd)/$WHEEL"
          export PYAPP_PYTHON_VERSION="3.12"
          export PYAPP_EXEC_MODULE="main"
          export PYAPP_UV_ENABLED="1"
          export PYAPP_IS_GUI="${{ matrix.is_gui }}"
          export PYAPP_DISTRIBUTION_EMBED="1"
          
          cd build/pyapp/pyapp-v0.29.0
          cargo build --release
          cd ../../..
          
          mkdir -p release
          cp build/pyapp/pyapp-v0.29.0/${{ matrix.binary_src }} release/${{ matrix.artifact_name }}
          chmod +x release/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release/${{ matrix.artifact_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Prepare Release Files
        run: |
          mkdir -p release
          find release-files -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
